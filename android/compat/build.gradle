plugins {
    id 'com.android.library'
}

android {
    namespace 'org.dls17.compat'
    compileSdk 35

    defaultConfig {
        minSdk 21
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}
